# Spatial dual-view GRPO, based on the vendored hybrid Spatial preset.
# Native Pi05 horizon=10; execute 8 actions for both world models.
# 128 envs * 8 rollouts * (240/8) = 30720 chunks = 15 global batches.
# micro=32 * 8 GPUs * 8 accumulation = global batch 2048.
defaults:
- env/wan_libero_spatial@env.train
- env/libero_spatial@env.eval
- model/pi0_5@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:PROJECT_ROOT}/third_party/RLinf/examples/embodiment/config
  - file://${oc.env:RLINF_BASE_ROOT}/examples/embodiment/config
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: ${oc.env:SPATIAL_WOVR_PLACEMENT,0-7}
runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:SPATIAL_WOVR_OUTPUT}
    project_name: rlinf
    experiment_name: spatial_wovr_wrist_v3_pi05_12000_8gpu_kir_first_close_pre16
    logger_backends:
    - tensorboard
  max_epochs: 50
  max_steps: 50
  only_eval: false
  val_check_interval: 5
  save_interval: 5
  resume_dir: null
  ckpt_path: null
  overlap_env_bootstrap: false
  memory_guard:
    enabled: false
    poll_seconds: 5.0
    stable_checks: 2
    foreign_limit_mib: 256.0
    imagination_free_gib: 38.0
    update_free_gib: 12.0
    checkpoint_each_step: true
    retain_imagination_cache: true
pi05_checkpoint_root: ${oc.env:PI05_CHECKPOINT_ROOT}
algorithm:
  normalize_advantages: true
  kl_penalty: low_var_kl
  group_size: 8
  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level
  adv_type: grpo
  loss_type: actor
  loss_agg_func: token-mean
  kl_beta: 0.01
  entropy_bonus: 0.0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_coef: 5.0
  filter_rewards: true
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5
  update_epoch: 1
  hybrid_ppo_grpo:
    enabled: false
    rho_max: 0.3
    rho_min: 0.0
    pacing_mode: entropy
    entropy_kappa: 0.5
    entropy_power: 1.0
    entropy_ref: 0.0
    ramp_steps: 5
    real_clip_ratio_low: 0.2
    real_clip_ratio_high: 0.2
    real_value_clip: 0.2
    real_huber_delta: 10.0
    real_value_loss_coef: 1.0
    real_kl_beta: null
    wm_kl_beta: null
    real_micro_batch_size: null
    real_global_batch_size: null
    paired_steps_per_epoch: null
    real_update_epochs: 1
    min_wm_signal_groups: 1
    skip_wm_during_critic_warmup: true
    grad_norm_match: true
    grad_conflict_mode: cosine_gate
    grad_cos_min: 0.0
env:
  group_name: EnvGroup
  train:
    shared_wan_pool: ${actor.shared_wan_pool}
    memory_guard: ${runner.memory_guard}
    rollout_epoch: 8
    total_num_envs: 128
    group_size: ${algorithm.group_size}
    auto_reset: false
    ignore_terminations: false
    mask_after_first_success: true
    # Opt-in throughput changes; ordinary entry points retain full generation.
    skip_successful_env_generation: false
    fast_frame_transfer: false
    # 400-episode calibration selects 0.9 by balanced accuracy; 100 held out.
    success_reward_threshold: 0.9
    success_consecutive_frames: 1
    hallucination_trust:
      enabled: false
      checkpoint_path: null
      mode: reward_soft
      eta_w: 1.0
      w_min: 0.1
      aggregation: blend
      blend_current: 0.5
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    reward_coef: ${algorithm.reward_coef}
    reset_gripper_open: true
    state_dim: 8
    use_libero_state_bridge: false
    use_policy_state: false
    debug_io: false
    use_kir_frame_pool: true
    kir_frame_pool_path: ${oc.env:SPATIAL_KIR_FRAME_POOL}
    # First stable gripper-close command minus 16 frames, one per episode.
    kir_fraction: 0.5
    # Absolute action deadline = longest successful episode for this task + grace.
    success_horizon_grace_steps: 16
    enable_kir: true
    wan_wm_hf_ckpt_path: ${oc.env:WAN_SPATIAL_CHECKPOINT}
    enable_offload: true
    num_inference_steps: 5
    chunk: 8
    cosmos_wrist_action_horizon: 8
    num_frames: 13
    condition_frame_length: 5
    use_cosmos_wrist: true
    cosmos_wrist_use_wovr_contract: true
    cosmos_gripper_action_mode: already_cosmos
    cosmos_wrist_primary_reference: true
    cosmos_wrist_input_camera_space: rlinf_runtime_rot180
    cosmos_wrist_guidance: 1.0
    cosmos_use_predicted_proprio: false
    worldpilot_root: ${oc.env:WORLDPILOT_ROOT}
    cosmos_host: 127.0.0.1
    cosmos_port: 8055
    cosmos_batch_size: 2
    cosmos_wrist_parallel_generation: false
    cosmos_image_size:
    - 224
    - 224
    cosmos_future_denoising_steps: 5
    cosmos_reward_mode: dense
    cosmos_value_enabled: false
    cosmos_value_host: 127.0.0.1
    cosmos_value_port: 8056
    video_show_shadow_wrist: false
    video_cfg:
      save_video: true
      record_every_n_episodes: 1
      info_on_video: false
      reward_plot_on_video: true
      reward_plot_show_return: false
      reward_plot_save_metrics: true
      reward_plot_height: 48
      reward_plot_max_points: 30
      fps: 2
      video_base_dir: ${runner.logger.log_path}/video/train
    init_params:
      camera_heights: 256
      camera_widths: 256
    openpi_gripper_action_mode: libero_01_to_signed
    cosmos_wrist_cross_view_primary_history: false
    cosmos_endpoints: ${oc.decode:${oc.env:SPATIAL_COSMOS_ENDPOINTS}}
  eval:
    # 8 waves * 64 envs cover all 500 ordered, unique simulator trials.
    rollout_epoch: 8
    total_num_envs: 64
    episodes_per_task: 50
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: true
    group_size: 1
    auto_reset: true
    ignore_terminations: false
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    reset_gripper_open: true
    is_eval: true
    video_cfg:
      save_video: true
      info_on_video: false
      reward_plot_on_video: true
      reward_plot_show_return: false
      reward_plot_save_metrics: true
      reward_plot_height: 48
      reward_plot_max_points: 30
      fps: 2
      video_base_dir: ${runner.logger.log_path}/video/eval
    openpi_gripper_action_mode: libero_01_to_signed
rollout:
  sampling_params:
    do_sample: true
    temperature_train: 1.6
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ${pi05_checkpoint_root}
    precision: ${actor.model.precision}
    model_type: openpi
    is_lora: false
    num_action_chunks: 8
    num_steps: 3
    openpi:
      config_name: pi05_libero
      num_images_in_input: 2
      action_chunk: 8
      action_env_dim: 7
      noise_level: 0.5
      num_steps: 3
      noise_method: flow_sde
      checkpoint_format: native
      action_horizon: 10
      discrete_state_input: false
    openpi_data: ${actor.model.openpi_data}
actor:
  group_name: ActorGroup
  shared_wan_pool:
    # Retain reusable CUDA memory across Wan imagination and policy updates.
    enabled: true
    target_job_gib: 75.0
    startup_target_job_gib: 65.0
    device_headroom_gib: 3.5
    rpc_timeout_seconds: 1200.0
    rpc_root: null
    log_dir: null
  gpu_memory_profile:
    enabled: false
    expected_optimizer_updates: null
  training_backend: fsdp
  micro_batch_size: 32
  global_batch_size: 2048
  seed: 42
  enable_offload: false
  model:
    model_path: ${pi05_checkpoint_root}
    model_type: openpi
    num_action_chunks: 8
    add_value_head: false
    openpi:
      config_name: pi05_libero
      num_images_in_input: 2
      action_chunk: 8
      num_steps: 3
      noise_level: 0.5
      action_env_dim: 7
      checkpoint_format: native
      action_horizon: 10
      discrete_state_input: false
    num_steps: 3
    openpi_data:
      norm_stats_path: ${pi05_checkpoint_root}/physical-intelligence/libero/norm_stats.json
  optim:
    lr: 5.0e-06
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
  fsdp_config:
    strategy: fsdp
    # Keep every 5-step model for eval; full optimizer/resume state at the end.
    save_full_model_weights: true
    save_training_state_at_steps: [50]
    sharding_strategy: no_shard
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
  memory_pool:
    enabled: true
    target_fraction: 0.8
    device_headroom_gib: 12.0
reward:
  use_reward_model: false
critic:
  use_critic_model: false
